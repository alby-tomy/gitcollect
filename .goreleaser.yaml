version: 2
project_name: gitcollect

builds:
    # Pinned because the repo now holds a second main package
    # (scripts/checkversions, a release-time docs check). goreleaser defaults
    # this to "." already; saying so means a future tool package can never
    # quietly change what gets released.
  - main: .
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "Merge pull request"]
