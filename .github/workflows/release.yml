name: release

# Releases are cut by pushing a semver tag. Everything below runs before any
# artifact is published, so a tag that does not build, does not pass tests, or
# does not live on main can never produce a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser's changelog and "git describe" both need full history,
          # and the main-containment check below needs the main branch too.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # v3.0.0 was tagged on a commit that existed on no branch at all, so the
      # released code was absent from main and from a fresh clone. Fail loudly
      # here instead of shipping that again.
      - name: tag must be an ancestor of main
        run: |
          # Fetch main into an explicit remote-tracking ref. actions/checkout
          # only creates the ref it checked out, so origin/main may not exist
          # locally even with fetch-depth: 0 — and "--depth=0" is not a valid
          # depth ("fatal: depth 0 is not a positive number"), which under
          # bash -e would abort this step and block every release.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from main."
            echo "Merge or fast-forward main to this commit before tagging."
            exit 1
          fi

      # The module path must carry the major-version suffix or the Go module
      # proxy silently ignores the tag and "go install ...@latest" keeps
      # serving v1. This is what made v2.0.0 through v3.0.0 uninstallable.
      - name: module path must match the tag's major version
        run: |
          major="${GITHUB_REF_NAME%%.*}"   # v3.0.0 -> v3
          module="$(go list -m)"
          case "$major" in
            v0|v1) want_suffix="" ;;
            *)     want_suffix="/$major" ;;
          esac
          if [ "${module%"$want_suffix"}" = "$module" ] && [ -n "$want_suffix" ]; then
            echo "::error::Module path is '$module' but tag $GITHUB_REF_NAME needs it to end in '$want_suffix'."
            exit 1
          fi
          echo "module '$module' is consistent with tag $GITHUB_REF_NAME"

      # Documented version samples have drifted three times, once showing
      # v1.0.0 — the symptom of installing without the /v3 suffix, which the
      # same page warns about. Gating here forces them to be updated in the
      # commit being tagged, rather than noticed a release or two later.
      - name: version samples match the tag
        run: go run ./scripts/checkversions -version "$GITHUB_REF_NAME"

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race

  release:
    name: goreleaser
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag can be pushed more than once, and each push re-triggers this
      # workflow. goreleaser then tries to upload assets that are already
      # attached and fails with "422 Validation Failed ... already_exists",
      # reporting a red run for what is really a no-op — the release itself
      # is intact. Detect that case and stop cleanly instead.
      - name: skip if this tag is already released
        id: released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" || true)

          assets=0
          if [ "$code" = "200" ]; then
            assets=$(jq '.assets | length' /tmp/release.json)
          fi

          # Only an already-published release with assets counts. A release
          # that exists but is empty — a half-finished run — must still be
          # allowed to proceed and upload.
          if [ "$code" = "200" ] && [ "$assets" -gt 0 ]; then
            echo "::notice::$GITHUB_REF_NAME is already released with $assets asset(s); nothing to do."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@v6
        if: steps.released.outputs.already != 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
